<div class="container">
	<h1>Transaction History</h1>

<style>
*{
	margin: 0;
	padding :0 ;
	box-sizing: border-box ;
	font-family: sans-serif ;
	font-size: 12px ;
}
h1{
	padding :10px ;
	display :grid ;
	justify-content :center ;
}
    #history-table {
      border-collapse: collapse;
      width: 100%;
    }
    #history-table th, #history-table td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    #history-table th {
      background-color: #f0f0f0;
    }
  </style>
</body>
<script>
	const historyBody = document.getElementById('history-body');
	
	// Load saved user info from local storage
	const savedUserInfo = JSON.parse(localStorage.getItem('userInfo')) || [];
	
	// Create table rows for saved user info
	savedUserInfo.forEach((userInfo) => {
		const row = document.createElement('tr');
		const nameCell = document.createElement('td');
		nameCell.textContent = userInfo.name;
		const telCell = document.createElement('td');
		telCell.textContent = userInfo.tel;
		const amountCell = document.createElement('td');
		amountCell.textContent = userInfo.amount;
		const optionCell = document.createElement('td');
		optionCell.textContent = userInfo.option;
		const bankCell = document.createElement('td');
		bankCell.textContent = userInfo.bank;
		row.appendChild(nameCell);
		row.appendChild(telCell);
		row.appendChild(amountCell);
		row.appendChild(optionCell);
		row.appendChild(bankCell);
		historyBody.appendChild(row);
	});
